name: Build release packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        default: 0.4.1

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian and Ubuntu package
        run: |
          VERSION="${RELEASE_VERSION#v}"
          command -v dpkg-deb
          bash packaging/deb/build-deb.sh "$VERSION"
      - name: Install and launch on Debian and Ubuntu
        run: |
          for image in debian:12-slim debian:13-slim ubuntu:24.04 ubuntu:latest; do
            echo "::group::${image}"
            docker run --rm -v "$PWD/dist:/packages:ro" -v "$PWD/packaging:/packaging:ro" \
              "${image}" sh -ec '
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /packages/*.deb >/dev/null
                sh /packaging/smoke-test.sh
                sh /packaging/smoke-test.sh venusprolinux --qindatk'
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Fedora RPM
        run: |
          VERSION="${RELEASE_VERSION#v}"
          mkdir -p dist
          docker run --rm -v "$PWD:/src" -w /src fedora:43 bash -lc "
            dnf install -y -q rpm-build redhat-rpm-config systemd-rpm-macros tar gzip &&
            bash packaging/rpm/build-rpm.sh '$VERSION'"
      - name: Install and launch on Fedora
        run: |
          for image in fedora:43 fedora:latest; do
            echo "::group::${image}"
            docker run --rm -v "$PWD/dist:/packages:ro" -v "$PWD/packaging:/packaging:ro" \
              "${image}" sh -ec '
                dnf install -y -q /packages/*.rpm
                sh /packaging/smoke-test.sh'
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Arch package
        run: |
          VERSION="${RELEASE_VERSION#v}"
          mkdir -p dist
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/out" archlinux:latest bash -lc "
            pacman -Syu --noconfirm --needed base-devel python python-hidapi python-pyqt6 &&
            useradd -m builder && chown builder:builder /out &&
            su builder -c \"DIST_DIR=/out bash /src/packaging/arch/build-arch.sh '$VERSION'\" &&
            pacman -U --noconfirm /out/*.pkg.tar.zst &&
            sh /src/packaging/smoke-test.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained AppImage
        run: |
          VERSION="${RELEASE_VERSION#v}"
          bash packaging/appimage/build-appimage.sh "$VERSION"
      - name: Launch the AppImage without host Python or Qt packages
        run: |
          launch() {
            echo "::group::$1"
            docker run --rm -e APPIMAGE_EXTRACT_AND_RUN=1 \
              -v "$PWD/dist:/packages:ro" -v "$PWD/packaging:/packaging:ro" \
              "$1" sh -ec "$2"' >/dev/null
                sh /packaging/smoke-test.sh /packages/*.AppImage'
            echo "::endgroup::"
          }
          launch debian:12-slim 'apt-get update -qq && apt-get install -y -qq libegl1 libgl1'
          launch debian:13-slim 'apt-get update -qq && apt-get install -y -qq libegl1 libgl1'
          launch fedora:latest 'dnf install -y -q mesa-libEGL mesa-libGL'
          launch archlinux:latest 'pacman -Sy --noconfirm --needed libglvnd mesa'
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak bundle
        run: |
          VERSION="${RELEASE_VERSION#v}"
          bash packaging/flatpak/build-flatpak.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*.flatpak

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build generic Linux payload
        run: |
          VERSION="${RELEASE_VERSION#v}"
          bash packaging/portable/build-tarball.sh "$VERSION"
      - name: Install and launch the payload on openSUSE Tumbleweed
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" -v "$PWD/packaging:/packaging:ro" \
            opensuse/tumbleweed sh -ec '
              zypper -q -n install python3 python3-PyQt6 python3-hidapi tar gzip
              tar -xzf /packages/*.tar.gz -C /tmp
              cp -a /tmp/venusprolinux-*-linux-any/usr/. /usr/
              sh /packaging/smoke-test.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [deb, rpm, arch, appimage, flatpak, portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --generate-notes --title "Venus Pro Linux $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
